services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  home-monitor-api:
    build: ./home-monitor-api
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/home-monitor
      PERENUAL_API_KEY: ${PERENUAL_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - ./home-monitor-api/credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  home-monitor-ui:
    build: ./home-monitor-ui
    restart: unless-stopped
    depends_on:
      home-monitor-api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo_data: