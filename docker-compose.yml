services:
  mongo:
    image: mongo:4.4.18
    container_name: mongodb_server
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command:
      - mongod
      - --wiredTigerCacheSizeGB=0.5
      - --bind_ip_all
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1.5G
    volumes:
      - mongo_data:/data/db

  home-monitor-api:
    build: 
      ## Temporary manual build until pipeline is refined
      # context: ./home-monitor-api
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/home-monitor
      PERENUAL_API_KEY: ${PERENUAL_API_KEY}
    command:
      - /bin/sh
      - -c
      - |
        until node -e 'const net = require("node:net"); const socket = net.createConnection(27017, "mongo"); socket.setTimeout(1000); socket.on("connect", () => { socket.destroy(); process.exit(0); }); socket.on("error", () => process.exit(1)); socket.on("timeout", () => { socket.destroy(); process.exit(1); });'; do
          echo "Waiting for MongoDB at mongo:27017..."
          sleep 2
        done
        exec node dist/index.js
    depends_on:
      mongo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    expose:
      - "5000"
    volumes:
      - ./home-monitor-api/credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 20s
      retries: 10

  home-monitor-ui:
    # image: home-monitor-ui:latest
    container_name: home-monitor-ui
    ## Temporary manual build until pipeline is refined
    build:
      context: ./ui
      dockerfile: Dockerfile
    # build: ./home-monitor-ui
    restart: unless-stopped
    depends_on:
      home-monitor-api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
    driver: local
    driver_opts:
      type: none
      device: ${DEVICE_PERMANENT_PATH}
      o: bind